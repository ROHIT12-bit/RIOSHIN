# This file configures the deployment on Render.
# It is set up to use Docker, so Render will automatically build the image
# from the Dockerfile and run it.
services:
  - type: worker
    name: telegram-auto-approval-bot
    env: docker
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: FORCE_SUB_CHANNELS
        sync: false
      - key: LOG_CHAT_ID
        sync: false
